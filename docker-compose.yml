services:

  loan-default-api:
    build: .
    container_name: loan-default-api
    ports:
      - "8000:8000"
    command:
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"

  streamlit:
    build: .
    container_name: loan-default-streamlit
    ports:
      - "8501:8501"
    depends_on:
      - loan-default-api
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501