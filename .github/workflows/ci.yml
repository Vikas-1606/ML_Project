name: CI/CD Pipeline

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      # 4. Lint
      - name: Lint Code with Ruff
        run: |
          ruff check src/ tests/

      # 5. Run tests
      - name: Run Pytest
        run: |
          pytest tests/ -v

      # 6. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t vikas61000/ml-eda-full-fledge:latest \
            -t vikas61000/ml-eda-full-fledge:${{ github.sha }} \
            .

      # 7. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. Push latest image
      - name: Push Latest Docker Image
        run: |
          docker push vikas61000/ml-eda-full-fledge:latest

      # 9. Push versioned image
      - name: Push Versioned Docker Image
        run: |
          docker push vikas61000/ml-eda-full-fledge:${{ github.sha }}