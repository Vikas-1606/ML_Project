name: CI/CD Pipeline

on:
  push:
    branches: [main, master]

  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # 3. Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff dvc-gdrive

      # 4. Restore DVC Google Drive OAuth credential
      - name: Restore DVC Google Drive Credential
        env:
          DVC_GOOGLE_TOKEN: ${{ secrets.DVC_GOOGLE_TOKEN }}
        run: |
          mkdir -p ~/.cache/pydrive2fs
          echo "$DVC_GOOGLE_TOKEN" | base64 -d > /tmp/dvc_google_token.json

          CLIENT_ID=$(python -c "import json; print(json.load(open('/tmp/dvc_google_token.json'))['client_id'])")

          mkdir -p "$HOME/.cache/pydrive2fs/${CLIENT_ID}"

          cp /tmp/dvc_google_token.json \
            "$HOME/.cache/pydrive2fs/${CLIENT_ID}/default.json"

          chmod 600 \
            "$HOME/.cache/pydrive2fs/${CLIENT_ID}/default.json"

      # 5. Pull DVC data
      - name: Pull DVC Data
        run: |
          dvc pull -v

      # 6. Verify dataset
      - name: Verify Dataset
        run: |
          ls -lh data/raw/Loan_Default.csv

      # 7. Lint
      - name: Lint Code with Ruff
        run: |
          ruff check src/ tests/

      # 8. Run tests
      - name: Run Pytest
        run: |
          pytest tests/ -v

      # 9. Build Docker image
      - name: Build Docker Image
        run: |
          docker build \
            -t vikas61000/ml-eda-full-fledge:latest \
            -t vikas61000/ml-eda-full-fledge:${{ github.sha }} \
            .

      # 10. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 11. Push latest Docker image
      - name: Push Latest Docker Image
        run: |
          docker push vikas61000/ml-eda-full-fledge:latest

      # 12. Push versioned Docker image
      - name: Push Versioned Docker Image
        run: |
          docker push vikas61000/ml-eda-full-fledge:${{ github.sha }}